# nginx 설정 조각 — 사이트 설정 파일(예: /etc/nginx/sites-available/kapae5070)의
# "listen 443 ssl" server 블록 안에 넣습니다. certbot이 넣은 ssl_* 줄은 건드리지 마세요.
# 바꾸기 전에 반드시 백업:  sudo cp -a /etc/nginx /etc/nginx.bak.$(date +%Y%m%d-%H%M%S)
# 적용:  sudo nginx -t && sudo systemctl reload nginx


# ───────────────────────────────────────────────────────────────
# [A] 긴급 차단 — 코드 배포 전이라도 지금 바로 넣을 것
#     (지금은 nginx가 저장소 폴더를 그대로 공개해서 .env, .git 등이 다운로드됨)
# ───────────────────────────────────────────────────────────────
location ~ /\.(?!well-known)      { deny all; }   # .env, .git/ 등 (인증서 갱신용 .well-known 제외)
location ~* \.(sql|sqlite|bat|md|txt|log|json)$ { deny all; }
location ~* ^/(server|database|db_test\w*|fix_db_user\w*|crawler|worker)\.js$ { deny all; }
location ^~ /backend_test/         { deny all; }
location ^~ /services/             { deny all; }
location ^~ /scrapers/             { deny all; }
location ^~ /node_modules/         { deny all; }
location ^~ /deploy/               { deny all; }


# ───────────────────────────────────────────────────────────────
# [B] 최종 형태 — 새 코드 배포 후, 기존 root / index / try_files / location 블록을
#     아래로 교체. 공개 파일 선택은 server.js의 화이트리스트가 담당합니다.
#     ([A]의 차단 규칙은 같이 남겨둬도 됩니다.)
# ───────────────────────────────────────────────────────────────
client_max_body_size 12m;          # 워크그래피 PDF 업로드(최대 10MB) 허용

location / {
    proxy_pass http://127.0.0.1:3000;          # .env의 PORT와 맞출 것
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;   # IP별 요청 제한에 필요
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;                    # AI 응답 대기
}
